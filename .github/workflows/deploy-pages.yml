name: Deploy website to GitHub Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Retrieve website assets
        run: bash scripts/fetch-site-assets.sh

      - name: Preserve website assets in the repository
        run: |
          if [[ -n "$(git status --porcelain public)" ]]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add public
            git commit -m "Add website assets [skip ci]"
            git push
          fi

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Build static website
        run: npx next build

      - name: Make Next.js assets compatible with branch publishing
        run: |
          mv out/_next out/site-assets
          while IFS= read -r -d '' file; do
            if grep -Iq '/_next/' "$file"; then
              sed -i 's#/_next/#/site-assets/#g' "$file"
            fi
          done < <(find out -type f -print0)

      # The repository was initially configured to publish the main branch
      # directly. Keep a copy of the generated site at the branch root so the
      # same website is served correctly under either Pages source setting.
      - name: Publish static website to the main branch root
        run: |
          rm -rf _next site-assets
          cp -a out/. ./
          touch .nojekyll
          if [[ -n "$(git status --porcelain -- . ':!public')" ]]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add -A -- . ':!public'
            git commit -m "Publish static website [skip ci]"
            git push
          fi

      - name: Prepare GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: out

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
